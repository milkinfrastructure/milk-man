name: Publish GPU images

on:
  push:
    branches: [main]
    paths:
      - images/train/**
      - images/eval/**
      - images/serve/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: milk-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/train
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/milkinfrastructure/milk-man-train:${{ github.sha }}
            ghcr.io/milkinfrastructure/milk-man-train:main
          cache-from: type=gha,scope=milk-train
          cache-to: type=gha,mode=max,scope=milk-train
          provenance: false
          sbom: false

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/eval
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/milkinfrastructure/milk-man-eval:${{ github.sha }}
            ghcr.io/milkinfrastructure/milk-man-eval:main
          cache-from: type=gha,scope=milk-eval
          cache-to: type=gha,mode=max,scope=milk-eval
          provenance: false
          sbom: false

  serve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/serve
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/milkinfrastructure/milk-man-serve:${{ github.sha }}
            ghcr.io/milkinfrastructure/milk-man-serve:main
          cache-from: type=gha,scope=milk-serve
          cache-to: type=gha,mode=max,scope=milk-serve
          provenance: false
          sbom: false
